[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "langchain-timbr"
dynamic = ["version"]
description = "LangChain & LangGraph extensions that parse LLM prompts into Timbr semantic SQL and execute them."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = {text = "MIT"}
authors = [{ name = "Timbr.ai", email = "contact@timbr.ai" }]
keywords = ["LLM", "LangChain", "LangGraph", "Timbr", "Semantic Layer", "Knowledge Graph", "SQL", "Agents"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "pydantic~=2.14.1",
  "tiktoken~=0.14.0",
  "uvicorn~=0.54.0",
  "pytimbr-api~=2.2.0",
  "langchain~=1.4.7",
  "langchain-core~=1.7.1",
  "langchain-community~=0.4.2",
  "langgraph~=1.2.18",
  "langgraph-checkpoint~=4.3.1",
  "cryptography~=50.0.2",
  "pyOpenSSL~=26.4.0",
  # transformers 5.21+ requires Python 3.11+
  "transformers~=5.21.1; python_version>='3.11'",
  "transformers~=5.20.2; python_version<'3.11'",
  "uuid6~=2025.0.1",
  "rapidfuzz~=3.14",
  "pyahocorasick~=2.3",
]

[project.optional-dependencies]
openai = [
  "openai~=3.41.0; python_version<'3.14'",
  "langchain-openai~=1.7.3; python_version<'3.14'",
]
azure_openai = [
  "azure-identity~=1.27.0; python_version<'3.14'",
  "openai~=3.41.0; python_version<'3.14'",
  "langchain-openai~=1.7.3; python_version<'3.14'",
]
anthropic = [
  "anthropic~=2.3.0; python_version<'3.14'",
  "langchain-anthropic~=1.7.7; python_version<'3.14'",
]
google = [
  "google-cloud-aiplatform>=2.7.0; python_version<'3.14'",
  "langchain-google-genai~=4.4.2; python_version<'3.14'",
]
vertex_ai = [
  "google-cloud-aiplatform>=2.7.0; python_version<'3.14'",
  "langchain-google-vertexai~=3.2.5; python_version<'3.14'",
  "pyarrow~=25.0.1; python_version<'3.14'",
]
# snowflake 1.14+ and snowflake-connector-python 4.8.1+ require Python 3.11+
snowflake = [
  "opentelemetry-api~=1.45.1; python_version<'3.12'",
  "opentelemetry-sdk~=1.45.1; python_version<'3.12'",
  "snowflake~=1.14.0; python_version>='3.11' and python_version<'3.14'",
  "snowflake~=1.13.2; python_version<'3.11'",
  "snowflake-snowpark-python~=1.55.3; python_version<'3.14'",
  "snowflake-connector-python[pandas]~=4.8.1; python_version>='3.11' and python_version<'3.14'",
  "snowflake-connector-python[pandas]~=4.8.0; python_version<'3.11'",
]
databricks = [
  "databricks-langchain~=0.22.0; python_version<'3.14'",
  "databricks-sdk~=0.158.0; python_version<'3.14'",
  "pyarrow~=25.0.1; python_version<'3.14'",
]
bedrock = [
  "langchain-aws~=1.9.1; python_version<'3.14'",
]
tracing = [
  "langsmith>=0.8.0; python_version<'3.14'",
]

# Development and testing
dev = [
  "langchain-tests~=1.1.9; python_version<'3.14'",
  "pytest~=9.2.0; python_version<'3.14'",
  "pytest-rerunfailures~=16.7; python_version<'3.14'",
]

# All optional dependencies
# NOTE: Python 3.14 is currently base-package-only.
# Optional dependency groups are gated with `; python_version < '3.14'` until
# provider compatibility is validated end-to-end.
all = [
  "anthropic~=2.3.0; python_version<'3.14'",
  "azure-identity~=1.27.0; python_version<'3.14'",
  "databricks-langchain~=0.22.0; python_version<'3.14'",
  "databricks-sdk~=0.158.0; python_version<'3.14'",
  "google-cloud-aiplatform>=2.7.0; python_version<'3.14'",
  "jiter~=0.18.0; python_version<'3.14'",
  "langchain-anthropic~=1.7.7; python_version<'3.14'",
  "langchain-aws~=1.9.1; python_version<'3.14'",
  "langchain-google-genai~=4.4.2; python_version<'3.14'",
  "langchain-google-vertexai~=3.2.5; python_version<'3.14'",
  "langchain-openai~=1.7.3; python_version<'3.14'",
  "langchain-tests~=1.1.9; python_version<'3.14'",
  "langsmith>=0.8.0; python_version<'3.14'",
  "openai~=3.41.0; python_version<'3.14'",
  "opentelemetry-api~=1.45.1; python_version<'3.12'",
  "opentelemetry-sdk~=1.45.1; python_version<'3.12'",
  "pyarrow~=25.0.1; python_version<'3.14'",
  "pytest~=9.2.0; python_version<'3.14'",
  "pytest-rerunfailures~=16.7; python_version<'3.14'",
  "snowflake~=1.14.0; python_version>='3.11' and python_version<'3.14'",
  "snowflake~=1.13.2; python_version<'3.11'",
  "snowflake-snowpark-python~=1.55.3; python_version<'3.14'",
  "snowflake-connector-python[pandas]~=4.8.1; python_version>='3.11' and python_version<'3.14'",
  "snowflake-connector-python[pandas]~=4.8.0; python_version<'3.11'",
]

[project.urls]
Homepage = "https://github.com/WPSemantix/langchain-timbr"
Documentation = "https://docs.timbr.ai/doc/docs/integration/langchain-sdk/"
Source = "https://github.com/WPSemantix/langchain-timbr"
Issues = "https://github.com/WPSemantix/langchain-timbr/issues"

[project.scripts]
langchain-timbr-benchmark = "langchain_timbr.benchmark_cli:main"

[tool.hatch.version]
source = "vcs"                                          # version comes from git

[tool.hatch.build.hooks.vcs]
version-file = "src/langchain_timbr/_version.py"        # generate a version file

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_timbr"]

